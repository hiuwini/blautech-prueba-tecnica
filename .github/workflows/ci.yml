name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  bootstrap:
    name: Bootstrap validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config

      - name: Check required project docs
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/development-plan.md
          test -f .env.example

  detect_services:
    name: Detect service manifests
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      mock_soap_server: ${{ steps.detect.outputs.mock_soap_server }}
      bff: ${{ steps.detect.outputs.bff }}
      document_processing: ${{ steps.detect.outputs.document_processing }}
      soap_gateway: ${{ steps.detect.outputs.soap_gateway }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect available services
        id: detect
        run: |
          if [ -f apps/frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f services/mock-soap-server/tests/test_server.py ]; then
            echo "mock_soap_server=true" >> "$GITHUB_OUTPUT"
          else
            echo "mock_soap_server=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f services/bff-notifications/package.json ]; then
            echo "bff=true" >> "$GITHUB_OUTPUT"
          else
            echo "bff=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f services/document-processing/requirements.txt ] || [ -f services/document-processing/pyproject.toml ]; then
            echo "document_processing=true" >> "$GITHUB_OUTPUT"
          else
            echo "document_processing=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f services/soap-gateway/requirements.txt ] || [ -f services/soap-gateway/pyproject.toml ]; then
            echo "soap_gateway=true" >> "$GITHUB_OUTPUT"
          else
            echo "soap_gateway=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend lint and tests
    runs-on: ubuntu-latest
    needs: detect_services
    if: ${{ needs.detect_services.outputs.frontend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Lint
        working-directory: apps/frontend
        run: npm run lint --if-present

      - name: Test
        working-directory: apps/frontend
        run: npm test --if-present

      - name: Build
        working-directory: apps/frontend
        run: npm run build --if-present

  mock-soap-server:
    name: Mock SOAP Server tests
    runs-on: ubuntu-latest
    needs: detect_services
    if: ${{ needs.detect_services.outputs.mock_soap_server == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        working-directory: services/mock-soap-server
        run: python3 -m unittest discover -s tests

  bff:
    name: BFF lint and tests
    runs-on: ubuntu-latest
    needs: detect_services
    if: ${{ needs.detect_services.outputs.bff == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: services/bff-notifications
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Lint
        working-directory: services/bff-notifications
        run: npm run lint --if-present

      - name: Test
        working-directory: services/bff-notifications
        run: npm test --if-present

      - name: Build
        working-directory: services/bff-notifications
        run: npm run build --if-present

  document-processing:
    name: FastAPI tests
    runs-on: ubuntu-latest
    needs: detect_services
    if: ${{ needs.detect_services.outputs.document_processing == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/document-processing/requirements.txt

      - name: Install dependencies
        working-directory: services/document-processing
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e ".[dev]" || python -m pip install -e .; fi

      - name: Test
        working-directory: services/document-processing
        run: python -m pytest

  soap-gateway:
    name: SOAP Gateway tests
    runs-on: ubuntu-latest
    needs: detect_services
    if: ${{ needs.detect_services.outputs.soap_gateway == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/soap-gateway/requirements.txt

      - name: Install dependencies
        working-directory: services/soap-gateway
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e ".[dev]" || python -m pip install -e .; fi

      - name: Test
        working-directory: services/soap-gateway
        run: python -m pytest
